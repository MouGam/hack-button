<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핵버튼</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #hackForm {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        #password {
            width: 100%;
            max-width: 300px;
            padding: 10px;
            margin-bottom: 20px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button[type="submit"] {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: #ff0000;
            color: white;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        button[type="submit"]:hover {
            transform: scale(1.05);
            background-color: #cc0000;
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4);
        }

        button[type="submit"]:active {
            transform: scale(0.95);
        }

        button[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 768px) {
            button[type="submit"] {
                width: 150px;
                height: 150px;
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            button[type="submit"] {
                width: 120px;
                height: 120px;
                font-size: 18px;
            }
        }

        #response {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            transition: opacity 0.5s ease-in-out;
            width: 100%;
            max-width: 300px;
            text-align: center;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <form id="hackForm" action="https://hassan.run/webhook/5715b767-23e9-43e9-92f8-4447286110f5" method="POST">
        <input type="password" id="password" name="password" required>
        <br><br>
        <button type="submit">발사</button>
    </form>
    <div id="response" style="display: none;"></div>

    <script>
        document.getElementById('hackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const responseDiv = document.getElementById('response');
            const submitButton = this.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                });
                
                const data = await response.json();

                if(data.result == "success"){
                    responseDiv.textContent = "success";
                    responseDiv.className = response.ok ? 'success' : 'error';
                    responseDiv.style.display = 'block';
                }else if(data.result == "pending"){
                    responseDiv.textContent = '현재 발사중. 대기필요';
                    responseDiv.className = 'error';
                    responseDiv.style.display = 'block';
                }else{
                    responseDiv.textContent = 'fail';
                    responseDiv.className = 'error';
                    responseDiv.style.display = 'block';
                }
            } catch (error) {
                responseDiv.textContent = '오류가 발생했습니다: ' + error.message;
                responseDiv.className = 'error';
                responseDiv.style.display = 'block';
            } finally {
                submitButton.disabled = false;
            }

            // 폼 초기화
            this.reset();
            
            // 3초 후에 응답 메시지 숨기기
            setTimeout(() => {
                responseDiv.style.opacity = '0';
                setTimeout(() => {
                    responseDiv.style.display = 'none';
                    responseDiv.style.opacity = '1';
                }, 500);
            }, 3000);
        });
    </script>
</body>
</html>
